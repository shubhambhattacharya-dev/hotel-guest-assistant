services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    ports:
      - "8000:8000"

    environment:
      PORT: 8000
      NODE_ENV: production
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}

    volumes:
      - ./data:/app/data:ro

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8000/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 3


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
